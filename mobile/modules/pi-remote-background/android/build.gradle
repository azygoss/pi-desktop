plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.github.azygoss.piremote'
version = '0.1.0'

android {
  namespace "io.github.azygoss.piremote.background"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // HeadlessJsTaskService: JS timers keep running while the service is up.
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.core:core-ktx:1.13.1'
}

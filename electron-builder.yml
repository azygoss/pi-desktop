appId: io.github.azygoss.pidesktop
productName: Pi Desktop
copyright: Copyright © 2026 Pi Desktop contributors

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - "!**/*.map"

# The bundled pi CLI spawns child processes and lazily requires native/wasm
# assets, so all production node_modules must live outside the asar.
asarUnpack:
  - node_modules/**

# The browser-tools pi extension is loaded by pi itself; the installed
# runtime (Homebrew node) cannot read inside app.asar, so ship it unpacked.
# Same for the computer-use helper: TCC attributes its AX/screen-recording
# calls to the app, and it must be a real executable on disk.
extraResources:
  - from: resources/pi-extension
    to: pi-extension
  - from: resources/cua-helper/bin/pi-desktop-cua
    to: cua-helper/pi-desktop-cua

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  identity: null
  hardenedRuntime: false

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

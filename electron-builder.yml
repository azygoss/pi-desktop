appId: io.github.azygoss.pidesktop
productName: Pi Desktop
copyright: Copyright © 2026 Pi Desktop contributors

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - "!**/*.map"
  # pi-remote (the headless host) is built into out/ too but ships separately.
  - "!out/host/**"
  - "!out/host-package/**"

# The bundled pi CLI spawns child processes and lazily requires native/wasm
# assets, so all production node_modules must live outside the asar.
asarUnpack:
  - node_modules/**

# The browser-tools pi extension is loaded by pi itself; the installed
# runtime (Homebrew node) cannot read inside app.asar, so ship it unpacked.
# Same for the computer-use and dictation helpers: they must be real
# executables on disk, signed with the app's identity (see mac below) so TCC
# attributes their AX / screen-recording / microphone use to the app.
extraResources:
  - from: resources/pi-extension
    to: pi-extension
  - from: resources/cua-helper/bin/pi-desktop-cua
    to: cua-helper/pi-desktop-cua
  - from: resources/dictation-helper/bin/pi-desktop-dictation
    to: dictation-helper/pi-desktop-dictation

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  extendInfo:
    NSMicrophoneUsageDescription: Pi Desktop uses the microphone for dictation.
    NSSpeechRecognitionUsageDescription: Pi Desktop transcribes your dictation into the message box.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # Signing: electron-builder picks the keychain's Developer ID Application
  # identity (or the one named in CSC_NAME) and signs every Mach-O inside the
  # bundle — the Swift helpers included, so macOS attributes their
  # Accessibility / Screen Recording / microphone use to Pi Desktop under one
  # stable team identity. Without a usable identity (CI) the build stays
  # unsigned; CSC_IDENTITY_AUTO_DISCOVERY=false forces that.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
